function coverFor(seed,st){
  let c1,c2;
  if(st){ if(st.dark>=st.warm&&st.hi>=st.lo){c1='#ff5c4d';c2='#2b0a24';}
    else if(st.dark>=st.warm){c1='#5b8def';c2='#140a2e';}
    else if(st.hi>=st.lo){c1='#ffb35c';c2='#2e0a18';}
    else {c1='#39f0c8';c2='#0a1e2e';} }
  else {const P=[['#ff3d81','#2b0a24'],['#a06bff','#140a2e'],['#39f0c8','#0a1e2e'],['#ffb35c','#2e0a18']];const p=P[hash(seed)%4];c1=p[0];c2=p[1];}
  return genCover(seed,c1,c2);
}

}

async function fetchPool(pl){

  const src=tr?tr.slice(0,60):null;
  AG.loading=true;render();

function hash(s){let h=9;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),387420489);return (h>>>0);}
function genCover(seed,c1,c2){
  const h=hash(seed),r=n=>((Math.imul(h^(n*2654435761),387420489)>>>0)%1000)/1000;
  let shapes='';
  for(let i=0;i<7;i++){const x=r(i)*300,y=r(i+7)*300,rad=18+r(i+14)*70;
    shapes+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad.toFixed(0)}" fill="${i%2?c1:c2}" opacity="${(0.10+r(i+21)*0.22).toFixed(2)}"/>`;}
  const g=seed.trim().charAt(0).toUpperCase();
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="300" height="300" fill="#12081c"/>${shapes}<rect width="300" height="300" fill="url(#g)" opacity=".28"/><text x="150" y="205" font-family="monospace" font-size="150" font-weight="700" text-anchor="middle" fill="#fff" opacity=".82">${g}</text><rect x="0" y="286" width="300" height="14" fill="${c1}"/></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

function parseTxt(txt){
  const out=[];

    const m=ln.trim().match(/^\d+\.\s*(.+)$/);if(!m)continue;
    const rest=m[1];const i=rest.indexOf(' - ');
    const a=i>0?rest.slice(0,i).trim():rest.trim();
    const t=i>0?rest.slice(i+3).trim():'';
    if(a||t)out.push([a,t]);
  }
  return out;
}
function pc(list,ws){const n=list.length||1;return +(100*list.filter(t=>ws.some(w=>t.includes(w))).length/n).toFixed(1);}
function analyze(tr){
  const T=tr.map(x=>x[1].toLowerCase());
  const arts={};tr.forEach(([a])=>{a.split(/,|&/).forEach(p=>{p=p.trim();if(p)arts[p]=(arts[p]||0)+1;});});
  const top=Object.entries(arts).sort((a,b)=>b[1]-a[1]);
  const S=Math.min(12,Math.max(4,Math.floor(tr.length/40)));
  const size=Math.floor(tr.length/S);const segs=[];
  for(let i=0;i<S;i++){const ch=tr.slice(i*size,(i+1)*size);const tt=ch.map(x=>x[1].toLowerCase());
    const aa={};ch.forEach(([a])=>{a.split(/,|&/).forEach(p=>{p=p.trim();if(p)aa[p]=(aa[p]||0)+1;});});
    segs.push({dark:pc(tt,LEX.dark),warm:pc(tt,LEX.warm),hi:pc(tt,LEX.hi),lo:pc(tt,LEX.lo),ratio:+(ch.length/Object.keys(aa).length).toFixed(2),n:ch.length});}

    latin:+(100*T.filter(t=>/[a-z]/.test(t)&&!/[а-я]/.test(t)).length/(tr.length||1)).toFixed(1),
    low:+(100*T.filter(t=>t&&t===t.toLowerCase()&&t.length>2).length/(tr.length||1)).toFixed(1),
    dups:tr.length-new Set(tr.map(([a,t])=>a.toLowerCase()+'||'+t.toLowerCase())).size,
    segs};
}

  const tracks=[];const seen=new Set();

  core.forEach(([t,a])=>{const key=t.toLowerCase();if(seen.has(key))return;seen.add(key);
    tracks.push({t,a,inpl:keys.filter(j=>SETS[j].has(a.toLowerCase()+'||'+t.toLowerCase())),tags:tags_of(t)});});
  const main=pl[keys[0]];const segs=main.segs||[];
  const sl=Math.floor(files[0].tracks.length/(segs.length||1));
  const years=segs.map((s,i)=>{const ch=files[0].tracks.slice(i*sl,(i+1)*sl);
    const c2={};ch.forEach(([a])=>{a=a.split(',')[0].trim();c2[a]=(c2[a]||0)+1;});
    const top=Object.entries(c2).sort((a,b)=>b[1]-a[1])[0]||['—',0];

      opinion:`Топ-голос этого плейлиста — <b>${esc(p.top1[0])}</b> (${p.top1[1]} треков). ${p.dark>p.warm+2?'Тьмы заметно больше тепла: сюда приходят не греться, а переживать.':p.warm>p.dark+2?'Тепла заметно больше тьмы: это полка, где тебя обнимают.':'Тьма и тепло в равновесии: фирменный режим погреба.'} ${p.low>50?'Половина названий с маленькой буквы: чувства шёпотом — твой почерк.':'Названия с большой: ты всё ещё веришь в заглавные буквы.'}`,
      extra:'Плейлист добавлен через сайт: правки, сводка и обложки живут локально в твоём браузере.'};});
  const union=new Set();keys.forEach(k=>SETS[k].forEach(x=>union.add(x)));

  return {pl,keys,M,core,tracks,artists,seg:segs,years,ny,quiz,gpool:{},cov:{},copy,url:{},urls:urls||{},art:(extra||{}).art||{},albums:(extra||{}).albums||{},locker:(extra||{}).locker||{},bot:(extra||{}).bot||'pogrebok_room_bot',

let PAUD=null;
let PLR={q:[],i:0,shuf:true,cur:null,loading:false,no:false,src:''};
function pbarInit(){
  if(PAUD)return;
  if(typeof Audio==='undefined')return;
  PAUD=new Audio();
  PAUD.addEventListener('timeupdate',()=>{const el=$('#pprog');if(el&&PAUD.duration)el.style.width=(100*PAUD.currentTime/PAUD.duration)+'%';});
  PAUD.addEventListener('ended',()=>pNext());
  PAUD.addEventListener('error',()=>{PLR.no=true;PLR.loading=false;pbar();});
}
async function fetchPreview(tr){
  const key=tr.a.toLowerCase()+'||'+tr.t.toLowerCase();
  D.prev=D.prev||{};
  if(D.prev[key])return D.prev[key].u||null;
  const norm=s=>s.toLowerCase().replace(/[^a-zа-я0-9 ]/g,' ').trim();
  try{
    const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(tr.a+' '+tr.t)+'&limit=4&entity=song');
    const d=await r.json();
    for(const res of d.results||[]){
      const nt=norm(res.trackName||''),nq=norm(tr.t),na=norm(res.artistName||'');
      if(res.previewUrl&&(nq.slice(0,14).includes(nt.slice(0,14))||nt.slice(0,14).includes(nq.slice(0,14)))&&na.includes(norm(tr.a).split(',')[0].split(' ')[0])){
        D.prev[key]={u:res.previewUrl,t:tr.t,a:tr.a};return res.previewUrl;}
    }
  }catch(e){}
  D.prev[key]={u:null,t:tr.t,a:tr.a};return null;
}
function pbar(){
  const el=$('#pbar');if(!el)return;
  if(!PLR.cur){el.classList.remove('on');return;}
  el.classList.add('on');
  const tr=PLR.cur;
  if(PLR.embed){el.innerHTML=`<div class="prow"><iframe src="${PLR.embed}" style="flex:1;height:76px;border:0;border-radius:12px" allow="autoplay; encrypted-media"></iframe>
  <div class="pext"><button onclick="pNext()" title="дальше">⏭</button><button onclick="PLR.cur=null;PLR.embed=null;pbar()" title="закрыть">✕</button></div></div>`;return;}
  el.innerHTML=`<div class="prow">${coverImg(tr,'pc')}
  <div class="pt"><b>${esc(tr.t)}</b><span>${esc(tr.a)} · ${PLR.loading?'стучусь в iTunes…':PLR.no?'нет превью — 30 сек не дали':(PLR.src||'превью 30 сек')}</span></div>
  <div class="pctl">
  <button onclick="pPrev()" title="предыдущий"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg></button>
  <button class="play" onclick="pToggle()" title="играть/пауза">${PAUD&&!PAUD.paused?'<svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>'}</button>
  <button onclick="pNext()" title="следующий"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg></button></div>
  <div class="pext"><button class="${PLR.shuf?'onA':''}" onclick="PLR.shuf=!PLR.shuf;pbar()" title="перемешать"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8H15l-2 2-1.5-1.5L13.9 6H17zM3 7h4l3 3-1.5 1.5L6 9H3zM17 13l4 4-4 4v-3h-3.1l-2.4 2.4L10 19l3-3h4zM3 15h3l2-2 1.5 1.5L7 17H3z" fill="currentColor"/></svg></button>
  <button onclick="PLR.cur=null;pbar()" title="закрыть"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4"/></svg></button></div></div>
  <div class="pp" onclick="pSeek(event)"><div class="fl" id="pprog" style="width:0%"></div></div>`;
}
function embedUrl(u){
  if(!u)return null;
  const yt=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if(yt)return 'https://www.youtube-nocookie.com/embed/'+yt[1]+'?autoplay=1';
  if(/soundcloud\.com\//.test(u))return 'https://w.soundcloud.com/player/?url='+encodeURIComponent(u)+'&auto_play=true&visual=false&height=90';
  const bc=u.match(/https?:\/\/([a-z0-9-]+)\.bandcamp\.com\/track\/([a-z0-9-]+)/i);
  if(bc)return 'https://bandcamp.com/EmbeddedPlayer/v=2/track='+bc[2]+'/size=large/';
  return null;
}
function pPlay(tr,src){
  pbarInit();PLR.cur=tr;PLR.src=src||'';PLR.no=false;
  const em=embedUrl((D.urls||{})[tr.a.toLowerCase()+'||'+tr.t.toLowerCase()]||tr.url||'');
  if(em){PLR.embed=em;PLR.loading=false;pbar();return;}
  PLR.embed=null;PLR.loading=true;pbar();
  fetchPreview(tr).then(u=>{PLR.loading=false;
    if(!u){PLR.no=true;pbar();return;}
    PLR.no=false;PAUD.src=u;PAUD.play().catch(()=>{});pbar();});
}
function pNext(){if(!PLR.q.length)return;PLR.i=(PLR.i+1)%PLR.q.length;pPlay(PLR.q[PLR.i],PLR.src);}
function pPrev(){if(!PLR.q.length)return;PLR.i=(PLR.i-1+PLR.q.length)%PLR.q.length;pPlay(PLR.q[PLR.i],PLR.src);}
function pSeek(e){if(!PAUD||!PAUD.duration)return;const r=e.currentTarget.getBoundingClientRect();PAUD.currentTime=PAUD.duration*(e.clientX-r.left)/r.width;}
function pToggle(){if(!PAUD||!PLR.cur)return;if(PAUD.paused){if(PAUD.src)PAUD.play().catch(()=>{});else pPlay(PLR.cur,PLR.src);}else PAUD.pause();pbar();}
function queueFor(k){
  let list=(D.pl[k]&&D.pl[k].tracks&&D.pl[k].tracks.length)?D.pl[k].tracks.map(([a,t])=>({a,t,tags:tags_of(t)})):D.tracks.filter(x=>x.inpl.includes(k));
  return list.slice(0,40);
}
function pqMask(k){
  const q=queueFor(k);if(!q.length)return;
  PLR.q=PLR.shuf?q.slice().sort(()=>Math.random()-.5):q.slice();PLR.i=0;
  pPlay(PLR.q[0],'маска '+D.pl[k].name);
}
function pqList(list,src){
  if(!list.length)return;PLR.q=PLR.shuf?list.slice().sort(()=>Math.random()-.5):list.slice();PLR.i=0;pPlay(PLR.q[0],src);
}

/* ================= РЕДАКТОР ОБЛОЖЕК v2: шаблоны + авто по сути ================= */
let COVC={};try{COVC=JSON.parse(localStorage.getItem('pogreb_cov')||'{}');}catch(e){}

let COVED=null,COVTAB='essence';
const COVPAL=[['#ff3d81','#2b0a24'],['#a06bff','#140a2e'],['#39f0c8','#0a1e2e'],['#ffb35c','#2e0a18'],['#b8f04a','#1c2a08'],['#5b8def','#0c1430'],['#ff5c4d','#1b0f33'],['#e8e8e8','#2a2a2a']];
const TPLN={letter:'буква',stripes:'полосы',rings:'кольца',grid:'сетка',wave:'волна',panelka:'панелька',vinyl:'винил',fog:'туман'};
function svgUri(inner){return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">'+inner+'</svg>');}
function genTpl(tpl,c1,c2,seed,title,st){
  const h=hash(seed+tpl),r=n=>((Math.imul(h^(n*2654435761),387420489)>>>0)%1000)/1000;
  const L=(title||'').trim().charAt(0).toUpperCase()||'♪';
  let b=`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="600" height="600" fill="${c2}"/>`;
  if(tpl==='letter'){
    for(let i=0;i<7;i++)b+=`<circle cx="${r(i)*600}" cy="${r(i+7)*600}" r="${30+r(i+14)*130}" fill="${i%2?c1:c2}" opacity="${0.10+r(i+21)*0.22}"/>`;
    b+=`<rect width="600" height="600" fill="url(#g)" opacity=".30"/><text x="300" y="410" font-family="monospace" font-size="300" font-weight="700" text-anchor="middle" fill="#fff" opacity=".85">${L}</text><rect y="572" width="600" height="28" fill="${c1}"/>`;
  } else if(tpl==='stripes'){
    const v=st?[st.dark,st.warm,st.hi*3,st.lo*3]:[40,30,20,10];let y=0;
    v.forEach((x,i)=>{const hh=80+Math.max(6,x)*3.2;b+=`<rect y="${y}" width="600" height="${hh}" fill="${i%2?c1:c2}" opacity="${0.55+0.12*i}"/>`;y+=hh;});
    b+=`<rect y="${y}" width="600" height="${600-y}" fill="${c2}"/><text x="30" y="560" font-family="monospace" font-size="34" fill="#fff" opacity=".9">${L}${L==='♪'?'':'·'}${(title||'').slice(0,14)}</text>`;
  } else if(tpl==='rings'){
    const v=st?[st.dark,st.warm,st.hi*3,st.lo*3]:[30,30,20,20];
    v.forEach((x,i)=>b+=`<circle cx="300" cy="300" r="${250-i*55}" fill="none" stroke="${i%2?c1:'#fff'}" stroke-width="${6+Math.max(2,x)/4}" opacity="${0.35+0.15*i}"/>`);
    b+=`<circle cx="300" cy="300" r="46" fill="${c1}"/><text x="300" y="316" font-family="monospace" font-size="44" font-weight="700" text-anchor="middle" fill="#fff">${L}</text>`;
  } else if(tpl==='grid'){
    for(let y=0;y<6;y++)for(let x=0;x<6;x++){const q=r(y*6+x);b+=`<rect x="${x*100}" y="${y*100}" width="98" height="98" fill="${q>0.62?c1:q>0.3?c2:'#12081c'}" opacity="${0.35+q*0.65}"/>`;}
    b+=`<rect x="200" y="250" width="200" height="100" fill="${c2}" opacity=".8"/><text x="300" y="322" font-family="monospace" font-size="64" font-weight="700" text-anchor="middle" fill="#fff">${L}</text>`;
  } else if(tpl==='wave'){
    let p='M0 300';for(let x=0;x<=600;x+=20)p+=` L${x} ${300+Math.sin(x/38+h%7)* (60+r(x%9)*70)}`;
    b+=`<rect width="600" height="600" fill="url(#g)" opacity=".25"/><path d="${p}" fill="none" stroke="${c1}" stroke-width="10" opacity=".9"/><path d="${p}" fill="none" stroke="#fff" stroke-width="3" opacity=".5" transform="translate(0,26)"/><text x="300" y="520" font-family="monospace" font-size="120" font-weight="700" text-anchor="middle" fill="#fff" opacity=".8">${L}</text>`;
  } else if(tpl==='panelka'){
    b+=`<rect width="600" height="600" fill="#10141c"/>`;
    for(let y=0;y<7;y++)for(let x=0;x<5;x++){const lit=(y*5+x)===(h%35);b+=`<rect x="${24+x*112}" y="${20+y*82}" width="86" height="60" fill="${lit?'#ffb35c':'#1c2534'}" opacity="${lit?1:0.9}"/>`;}
    for(let i=0;i<40;i++)b+=`<circle cx="${r(i)*600}" cy="${r(i+3)*600}" r="2" fill="#fff" opacity=".5"/>`;
    b+=`<text x="300" y="580" font-family="monospace" font-size="26" text-anchor="middle" fill="#8fa" opacity=".8">${(title||'').slice(0,18)}</text>`;
  } else if(tpl==='vinyl'){
    b+=`<rect width="600" height="600" fill="#0a0710"/>`;
    for(let rr=280;rr>110;rr-=8)b+=`<circle cx="300" cy="300" r="${rr}" fill="none" stroke="#fff" opacity="${0.05+0.04*Math.abs(Math.sin(rr/7))}" stroke-width="2"/>`;
    b+=`<circle cx="300" cy="300" r="105" fill="url(#g)"/><circle cx="300" cy="300" r="8" fill="#0a0710"/><text x="300" y="330" font-family="monospace" font-size="64" font-weight="700" text-anchor="middle" fill="#fff">${L}</text>`;
  } else { /* fog */
    b+=`<filter id="b"><feGaussianBlur stdDeviation="46"/></filter><g filter="url(#b)">`;
    for(let i=0;i<5;i++)b+=`<circle cx="${120+r(i)*360}" cy="${120+r(i+5)*360}" r="${90+r(i+9)*120}" fill="${i%2?c1:'#fff'}" opacity="${0.25+r(i+13)*0.3}"/>`;
    b+=`</g><text x="300" y="560" font-family="monospace" font-size="40" font-weight="700" text-anchor="middle" fill="#fff" opacity=".9">${(title||'').slice(0,16)}</text>`;
  }
  return svgUri(b);
}
function moodPal(p){
  if(p.dark>=p.warm&&p.hi>=p.lo)return COVPAL[6];
  if(p.dark>=p.warm)return COVPAL[5];
  if(p.hi>=p.lo)return COVPAL[3];
  return COVPAL[2];
}
function autoTpl(p){
  if(p.dark>=p.warm&&p.lo>=p.hi)return 'panelka';
  if(p.dark>=p.warm)return 'rings';
  if(p.warm>p.dark&&p.lo>=p.hi)return 'vinyl';
  if(p.warm>p.dark)return 'stripes';
  return 'letter';
}
function autoDef(k,variant){
  const p=D.pl[k];const v=variant||0;
  const tpls=[autoTpl(p),'letter','panelka','vinyl','wave','fog','grid','stripes'];
  const pals=[moodPal(p),COVPAL[0],COVPAL[1],COVPAL[4]];
  return {t:'gen',tpl:tpls[v%tpls.length],c1:pals[v%pals.length][0],c2:pals[v%pals.length][1],seed:String(p.n+v*7)};
}
function defSrc(def,k){

}
function covReset(){if(COVED)delete COVC[COVED.k];saveCOVC();const e=document.getElementById('coved');if(e)e.remove();render();}
function covSave(){COVC[COVED.k]=COVED.def;saveCOVC();const e=document.getElementById('coved');if(e)e.remove();render();}
function covAuto(k){COVC[k]=autoDef(k,Math.floor(Math.random()*4));saveCOVC();render();}


render();
</script>
